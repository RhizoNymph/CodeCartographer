[package]
name = "cc-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
ignore = "0.4"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"

[dev-dependencies]
tempfile = "3"
criterion = { workspace = true }

# The lib has no `#[bench]` functions, but cargo still builds a libtest bench
# harness for it and runs it as part of `cargo bench -p cc-core`. That harness
# rejects criterion's CLI flags, so `cargo bench -p cc-core -- --sample-size 20`
# fails before reaching a single benchmark. Opting the lib out leaves the two
# criterion targets as the only bench targets.
[lib]
bench = false

[[bench]]
name = "graph_bench"
harness = false

[[bench]]
name = "parse_bench"
harness = false
